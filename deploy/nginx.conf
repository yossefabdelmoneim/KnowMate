server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;

    location /api/ { proxy_pass http://backend:8000/api/; }
    location /auth/ { proxy_pass http://backend:8000/auth/; }
    location /documents/ { proxy_pass http://backend:8000/documents/; }
    location /search/ { proxy_pass http://backend:8000/search/; }
    location /companies/ { proxy_pass http://backend:8000/companies/; }
    location /sessions/ { proxy_pass http://backend:8000/sessions/; }
    location /memory/ { proxy_pass http://backend:8000/memory/; }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_read_timeout 10s;
    }

    location ~ ^/analyze(/|$) {
        proxy_pass http://backend:8000;
        proxy_read_timeout 600s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
